<style>
:root{color-scheme:light;--paper:#f7f3eb;--ink:#22201e;--coral:#ff7067;--line:#d8d1c5}

.player{position:sticky;bottom:14px;margin-top:18px;background:#24211f;color:white;border-radius:24px;padding:20px;box-shadow:0 16px 45px #30291f33}

.play{width:58px;height:58px;border:0;border-radius:50%;background:var(--coral);color:white;font-size:22px;cursor:pointer}.play:active{transform:scale(.95)}

.mix{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.track{border:1px solid #514c47;border-radius:12px;padding:10px;display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer}.track input{accent-color:var(--coral)}
.controls{display:flex;align-items:center;gap:16px;margin-top:14px;font-size:12px;color:#c4bdb6}.controls input[type=range]{width:130px;accent-color:var(--coral)}
.status{margin-left:auto;color:#938c85}@media(max-width:600px){.songs{grid-template-columns:1fr}.mix{grid-template-columns:repeat(2,1fr)}header{align-items:start;flex-direction:column}}
