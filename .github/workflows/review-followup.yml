name: Apply review regression fixes
on:
  workflow_dispatch:
  push:
    branches: ['codex/everyday-mad-overhaul']
    paths: ['.github/workflows/review-followup.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Apply reviewed delta against exact source hashes
        env:
          PATCH_DATA: ''
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/everyday-mad-overhaul'
          changes = json.loads(zlib.decompress(base64.b64decode(os.environ['PATCH_DATA'], validate=True)))
          files = []
          for e in changes:
              p = pathlib.Path(e['path'])
              assert not p.is_absolute() and '..' not in p.parts
              old = p.read_bytes()
              assert hashlib.sha256(old).hexdigest() == e['before'], p
              lines = old.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(e['edits']):
                  lines[start:end] = [replacement]
              data = ''.join(lines).encode()
              assert hashlib.sha256(data).hexdigest() == e['after'], p
              files.append((p, data))
          for p, data in files:
              p.write_bytes(data)
          subprocess.run(['dart','format'] + [str(p) for p,_ in files if p.suffix == '.dart'],check=True)
          pathlib.Path('.github/workflows/review-followup.yml').unlink()
          PY
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: tolerate failed thumbnails and align regression tests with everyday music'
          git push origin HEAD:refs/heads/codex/everyday-mad-overhaul
          mkdir -p ci-logs
          git rev-parse HEAD | tee ci-logs/commit.txt
          git archive --format=zip HEAD -o review-followup-source.zip
      - run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --fatal-infos 2>&1 | tee ci-logs/analyze.txt
        shell: bash
      - name: Test
        id: tests
        continue-on-error: true
        run: flutter test --reporter expanded 2>&1 | tee ci-logs/test.txt
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: review-followup-validation
          path: |
            review-followup-source.zip
            ci-logs
            ci-artifacts
          retention-days: 7
      - name: Require passing validation
        if: always()
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: test "$ANALYZE" = success && test "$TESTS" = success
