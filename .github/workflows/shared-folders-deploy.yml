name: Deploy shared folders

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-folders-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/shared-folders
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/shared-folders/package-lock.json
      - run: npm ci
      - name: Provision private R2 and deploy Worker
        run: node scripts/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Save deployment URL
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shared-folders-deployment-info
          path: backend/shared-folders/.wrangler/deployment-info.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
