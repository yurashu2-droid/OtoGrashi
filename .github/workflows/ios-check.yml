name: iOS check

on:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/ios-check.yml'

permissions:
  contents: read

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-check:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_PATH: /Applications/Xcode_26.6.app
      FLUTTER_VERSION: 3.47.5
      # Full checks render every mode, the 1080p movie and the rotated/HDR
      # sources. Ordinary branch pushes render a representative subset; add
      # [full-ci] to a commit message to run everything on a branch.
      OTO_FULL_CHECKS: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]')) && '1' || '0' }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify pinned runner and Xcode
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS:-unavailable}"
            echo "image_version=${ImageVersion:-unavailable}"
            sw_vers
            uname -a
          } 2>&1 | tee ci-logs/runner.txt
          test -d "$XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version 2>&1 | tee ci-logs/xcode.txt
          grep -Fx 'Xcode 26.6' ci-logs/xcode.txt
          grep -Fx 'Build version 17F113' ci-logs/xcode.txt

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Log Flutter and Dart toolchain
        shell: bash
        run: |
          set -o pipefail
          flutter --version 2>&1 | tee ci-logs/flutter.txt
          dart --version 2>&1 | tee ci-logs/dart.txt
          if [[ "$OTO_FULL_CHECKS" == 1 ]]; then
            flutter doctor -v 2>&1 | tee ci-logs/flutter-doctor.txt
          fi
          test "$(flutter --version --machine | ruby -rjson -e 'puts JSON.parse(STDIN.read)["frameworkVersion"]')" = "$FLUTTER_VERSION"

      - name: Resolve dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ci-logs/pub-get.txt

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee ci-logs/analyze.txt

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ci-logs/test.txt

      - name: Build unsigned iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --simulator --debug 2>&1 | tee ci-logs/ios-simulator-build.txt

      - name: Run native tests on an installed iPhone simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          SIMULATOR_UDID="$(xcrun simctl list devices available --json | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices")
            iphone = devices
              .select { |runtime, _| runtime.include?("iOS") }
              .flat_map { |_, entries| entries }
              .find { |device| device["isAvailable"] && device["name"].include?("iPhone") }
            puts iphone && iphone.fetch("udid")
          ')"
          test -n "$SIMULATOR_UDID"
          echo "simulator_udid=$SIMULATOR_UDID" | tee ci-logs/simulator.txt
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>&1 | tee -a ci-logs/simulator.txt
          echo "full_checks=$OTO_FULL_CHECKS" | tee -a ci-logs/simulator.txt
          TEST_RUNNER_OTO_FULL_CHECKS="$OTO_FULL_CHECKS" xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath ci-artifacts/RunnerTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ci-logs/xctest.txt

      - name: Summarize native test result bundle
        if: always()
        shell: bash
        run: |
          if [[ -d ci-artifacts/RunnerTests.xcresult ]]; then
            xcrun xcresulttool get test-results summary \
              --path ci-artifacts/RunnerTests.xcresult \
              | tee ci-logs/xctest-summary.json
            xcrun xcresulttool get test-results tests \
              --path ci-artifacts/RunnerTests.xcresult \
              | tee ci-logs/xctest-details.json
          else
            echo "RunnerTests.xcresult was not created" | tee ci-logs/xctest-summary.txt
          fi

      - name: Verify rendered audio evidence
        if: always()
        shell: bash
        run: |
          test -f ci-artifacts/audio-render-fixture.wav
          test -f ci-artifacts/audio-render-report.json

      - name: Verify rendered video evidence
        if: always()
        shell: bash
        run: |
          test -f ci-artifacts/video-render-preview.mp4
          test -f ci-artifacts/video-render-preview.json
          if [[ "$OTO_FULL_CHECKS" == 1 ]]; then
            test -f ci-artifacts/video-render-full.mp4
            test -f ci-artifacts/video-render-full.json
          fi

      - name: Publish log summaries as annotations
        if: always()
        shell: bash
        run: |
          # Annotations are readable without signing in, so failures can be
          # diagnosed from the public check run as well as from the logs.
          summarize() {
            local file="ci-logs/$1.txt" title="$1" pattern="$2"
            [ -f "$file" ] || return 0
            local lines
            lines="$( (grep -nE "$pattern" "$file" || true) | head -60 | cut -c1-240)"
            [ -n "$lines" ] || return 0
            lines="${lines//'%'/'%25'}"
            lines="${lines//$'\n'/'%0A'}"
            echo "::warning title=${title}::${lines:0:3800}"
          }
          summarize analyze 'error|warning|info|•|issues? found'
          summarize test '\[E\]|Expected:|Actual:|Error:|Exception|FAILED|Some tests failed|All tests passed'
          # a failing expectation with the test name and stack around it
          if [ -f ci-logs/test.txt ]; then
            fail="$( (grep -n -B6 -A24 -E 'Expected:|\[E\]' ci-logs/test.txt || true) | head -90 | cut -c1-200)"
            fail="${fail//'%'/'%25'}"
            [ -z "$fail" ] || echo "::warning title=failing dart test::${fail//$'\n'/'%0A'}"
          fi
          summarize ios-simulator-build 'error:|Error'
          summarize xctest 'error:|failed|Executed|TEST SUCCEEDED|TEST FAILED|XCTAssert|MAD_CHECK'
          # the slowest native tests, so the check can be kept short
          if [ -f ci-logs/xctest.txt ]; then
            slow="$( (grep -oE "Test Case '-\[RunnerTests\.[A-Za-z]+ [A-Za-z0-9_]+\]' (passed|skipped|failed) \([0-9.]+ seconds\)" ci-logs/xctest.txt || true) \
              | sed -E "s/Test Case '-\[RunnerTests\.([A-Za-z]+) ([A-Za-z0-9_]+)\]' ([a-z]+) \(([0-9.]+) seconds\)/\4s \3 \1.\2/" \
              | sort -rn | head -15)"
            [ -z "$slow" ] || echo "::notice title=slowest native tests::${slow//$'\n'/'%0A'}"
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-check-evidence-${{ github.run_id }}
          path: |
            ci-logs
            ci-artifacts
          if-no-files-found: warn
          retention-days: 14
