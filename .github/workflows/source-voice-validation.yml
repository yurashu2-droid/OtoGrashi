name: Source voice regression
on:
  push:
    branches: ['codex/source-preserving-melody']
    paths:
      - 'ios/Runner/Media/EverydayAudioDSP.swift'
      - 'scripts/review/**'
      - '.github/workflows/source-voice-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Run production Swift DSP regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs ci-artifacts
          git rev-parse HEAD | tee ci-logs/commit.txt
          for TEST in SourceVoiceRegression DSPRegression DynamicVoiceRegression; do
            swiftc -O ios/Runner/Media/EverydayAudioDSP.swift scripts/review/$TEST.swift -o /tmp/$TEST
            /tmp/$TEST | tee ci-logs/$TEST.txt
          done
          python3 scripts/review/check_analysis.py | tee ci-logs/analysis-regression.txt
      - name: Compare old and new processing on real speech
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/review/prepare_voice_fixture.py ci-artifacts/voice-comparison
          git show f02eab5619815668ba1bf2136348dca9265f56f7:ios/Runner/Media/EverydayAudioDSP.swift | sed 's/enum EverydayAudioDSP/enum LegacyEverydayAudioDSP/' > /tmp/LegacyEverydayAudioDSP.swift
          swiftc -O ios/Runner/Media/EverydayAudioDSP.swift /tmp/LegacyEverydayAudioDSP.swift scripts/review/VoiceComparison.swift -o /tmp/voice-comparison
          /tmp/voice-comparison ci-artifacts/voice-comparison/input.f32 ci-artifacts/voice-comparison | tee ci-logs/comparison.txt
          git archive --format=zip HEAD -o ci-artifacts/source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-voice-regression-evidence
          path: |
            ci-logs
            ci-artifacts
          retention-days: 7
