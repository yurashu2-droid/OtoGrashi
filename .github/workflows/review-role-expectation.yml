name: Finalize role regression
on:
  push:
    branches: ['codex/everyday-mad-overhaul']
    paths: ['.github/workflows/review-role-expectation.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preserve the legacy source as melody rather than reject its role
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/everyday-mad-overhaul'
          p = pathlib.Path('test/domain/arrangement_engine_test.dart')
          text = p.read_text()
          old = "expect(legacy.songRoles?.bass, 'old-voice');"
          assert text.count(old) == 1
          p.write_text(text.replace(old, "expect(legacy.songRoles?.melody, 'old-voice');\n    expect(legacy.songRoles?.bass, 'room');"))
          pathlib.Path('.github/workflows/review-role-expectation.yml').unlink()
          PY
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: preserve unmeasured legacy voices in the melody role'
          git push origin HEAD:refs/heads/codex/everyday-mad-overhaul
