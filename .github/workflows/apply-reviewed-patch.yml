name: Apply and validate isolated review
on:
  push:
    branches: ['codex/everyday-mad-overhaul']
    paths: ['.github/workflows/apply-reviewed-patch.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Apply exact locally reviewed changes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/everyday-mad-overhaul'
          root = pathlib.Path.cwd()
          transport = root / 'scripts/review/transport'
          packed = base64.b64decode(''.join((transport / f'part{i}.txt').read_text() for i in range(4)), validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'dda33ba2d87b56aff6fb8b548112da4473e697cb51f349c58cce7a7ad53374af'
          entries = json.loads(lzma.decompress(packed))
          results = []
          for entry in entries:
              relative = pathlib.PurePosixPath(entry['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] in ('lib','ios','test','scripts','docs','.github')
              path = root / relative
              assert path.resolve().is_relative_to(root)
              old = path.read_bytes() if path.exists() else None
              actual = hashlib.sha256(old).hexdigest() if old is not None else None
              assert actual == entry['before'], f'Changed baseline: {relative}'
              if entry.get('delete'):
                  new = None
              elif 'content' in entry:
                  new = entry['content'].encode()
              else:
                  lines = old.decode().splitlines(keepends=True)
                  for start, end, replacement in reversed(entry['edits']):
                      lines[start:end] = [replacement]
                  new = ''.join(lines).encode()
              actual = hashlib.sha256(new).hexdigest() if new is not None else None
              assert actual == entry['after'], f'Incorrect patch result: {relative}'
              results.append((path, new))
          for path, new in results:
              if new is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(new)
          subprocess.run(['git','add','--'] + [e['path'] for e in entries], check=True)
          for path in transport.glob('part*.txt'):
              path.unlink()
          (root / '.github/workflows/apply-reviewed-patch.yml').unlink()
          subprocess.run(['git','add','-u'], check=True)
          print(f'Applied and verified {len(results)} source changes.')
          PY
      - name: Format changed Dart files and publish isolated branch
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          changed = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          dart = [p for p in changed if p.endswith('.dart') and pathlib.Path(p).is_file()]
          subprocess.run(['dart','format'] + dart, check=True)
          PY
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: turn everyday voices into synchronized MAD music'
          git push origin HEAD:refs/heads/codex/everyday-mad-overhaul
          mkdir -p ci-logs ci-artifacts
          git rev-parse HEAD | tee ci-logs/review-commit.txt
          git archive --format=zip HEAD -o review-implemented-source.zip
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee ci-logs/review-analyze.txt
      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee ci-logs/review-test.txt
      - name: Upload reviewed source and validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: everyday-review-validation
          path: |
            ci-logs
            ci-artifacts
            review-implemented-source.zip
          retention-days: 7
      - name: Require passing analysis and tests
        if: always()
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: test "$ANALYZE_OUTCOME" = success && test "$TEST_OUTCOME" = success
