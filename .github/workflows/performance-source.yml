name: Performance source snapshot
on:
  push:
    branches: ['codex/mad-performance-modes']
    paths: ['.github/workflows/performance-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: git archive --format=zip HEAD -o performance-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-source
          path: performance-source.zip
          retention-days: 3
