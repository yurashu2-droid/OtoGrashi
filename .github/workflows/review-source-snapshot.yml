name: Review source snapshot
on:
  push:
    branches: ['codex/everyday-mad-overhaul']
    paths: ['.github/workflows/review-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Archive tracked source for local regression work
        run: git archive --format=zip HEAD -o review-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-source-snapshot
          path: review-source.zip
          retention-days: 1
