name: Source-preserving voice review
on:
  push:
    branches: ['codex/source-preserving-melody']
    paths: ['.github/workflows/source-voice-review.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply exact reviewed changes
        shell: bash
        env:
          PATCH_DATA: ''
        run: |
          set -euo pipefail
          mkdir -p ci-logs ci-artifacts
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/source-preserving-melody'
          encoded = os.environ['PATCH_DATA']
          payload = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(payload).hexdigest() == 'ba7ae4a172a4cdee56d9fe6e085474c5efa6d495294511d6a5c98e288c2752a1', 'transport checksum'
          pending = []
          for entry in json.loads(zlib.decompress(payload)):
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts
              old = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None) == entry['before'], path
              lines = old.decode().splitlines(keepends=True) if old else []
              for start, end, replacement in reversed(entry['edits']):
                  lines[start:end] = [replacement]
              new = ''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest() == entry['after'], path
              pending.append((path, new))
          for path, new in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          subprocess.run(['dart', 'format'] + [str(p) for p, _ in pending if p.suffix == '.dart'], check=True)
          subprocess.run(['git', 'add'] + [str(p) for p, _ in pending], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve voice timbre and continuous beat-aligned melody passages'
          git push origin HEAD:refs/heads/codex/source-preserving-melody
          git rev-parse HEAD | tee ci-logs/commit.txt
          git archive --format=zip HEAD -o ci-artifacts/source.zip
      - name: Actual Swift DSP regressions
        shell: bash
        run: |
          set -euo pipefail
          swiftc -O ios/Runner/Media/EverydayAudioDSP.swift scripts/review/SourceVoiceRegression.swift -o /tmp/source-voice-tests
          /tmp/source-voice-tests | tee ci-logs/source-voice-dsp.txt
          swiftc -O ios/Runner/Media/EverydayAudioDSP.swift scripts/review/DSPRegression.swift -o /tmp/dsp-tests
          /tmp/dsp-tests | tee ci-logs/dsp.txt
          python3 scripts/review/check_analysis.py | tee ci-logs/analysis-regression.txt
      - name: Flutter analysis
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee ci-logs/flutter-analyze.txt
      - name: Flutter tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee ci-logs/flutter-test.txt
      - name: Real speech comparison
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/review/prepare_voice_fixture.py ci-artifacts/voice-comparison
          git show f02eab5619815668ba1bf2136348dca9265f56f7:ios/Runner/Media/EverydayAudioDSP.swift | sed 's/enum EverydayAudioDSP/enum LegacyEverydayAudioDSP/' > /tmp/LegacyEverydayAudioDSP.swift
          swiftc -O ios/Runner/Media/EverydayAudioDSP.swift /tmp/LegacyEverydayAudioDSP.swift scripts/review/VoiceComparison.swift -o /tmp/voice-comparison
          /tmp/voice-comparison ci-artifacts/voice-comparison/input.f32 ci-artifacts/voice-comparison | tee ci-logs/voice-comparison.txt
      - name: Build iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          flutter build ios --simulator --debug 2>&1 | tee ci-logs/build.txt
      - name: Native audio and synchronized video tests
        shell: bash
        run: |
          set -euo pipefail
          ID="$(xcrun simctl list devices available --json | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x.get("isAvailable") and "iPhone" in x["name"]))')"
          xcrun simctl boot "$ID" 2>/dev/null || true
          xcrun simctl bootstatus "$ID" -b
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$ID" -parallel-testing-enabled NO -only-testing:RunnerTests/AudioAnalyzerTests -only-testing:RunnerTests/AudioRendererTests -only-testing:RunnerTests/VideoRendererTests/testRealDartEverydayTimelineRendersAsSynchronizedMADVideo -resultBundlePath ci-artifacts/VoiceTests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-logs/native-tests.txt
      - name: Summarize native evidence
        if: always()
        shell: bash
        run: |
          if [ -d ci-artifacts/VoiceTests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path ci-artifacts/VoiceTests.xcresult > ci-logs/native-summary.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-preserving-voice-evidence
          path: |
            ci-logs
            ci-artifacts
          retention-days: 7
