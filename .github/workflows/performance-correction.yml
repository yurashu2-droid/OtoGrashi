name: Performance validation correction
on:
  push:
    branches: ['codex/mad-performance-modes']
    paths: ['.github/workflows/performance-correction.yml']
permissions:
  contents: write
  actions: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/mad-performance-modes
      - name: Correct compact settings expression
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/features/create/creation_flow.dart');s=p.read_text();old='selectDuration)))))),),';new='selectDuration))))),),';assert old in s or new in s;s=s.replace(old,new);p.write_text(s)
          PY
          git add lib/features/create/creation_flow.dart
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: compact settings builder expression [skip ci]'
            git push origin HEAD:refs/heads/codex/mad-performance-modes
          fi
          gh run watch 36074501764 --repo yurashu2-droid/OtoGrashi --interval 10 || true
          gh run rerun 36074501764 --repo yurashu2-droid/OtoGrashi
