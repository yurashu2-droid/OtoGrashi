name: Performance validation correction
on:
  push:
    branches: ['codex/mad-performance-modes']
    paths: ['.github/workflows/performance-correction.yml']
permissions:
  contents: write
  actions: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/mad-performance-modes
      - name: Correct explicit-block lint findings in the reviewed code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/domain/performance_arranger.dart');s=p.read_text();s=s.replace('e.treatment == SoundTreatment.rhythm)\n          continue;', 'e.treatment == SoundTreatment.rhythm) {\n          continue;\n        }');p.write_text(s)
          p=Path('lib/features/create/creation_controller.dart');s=p.read_text();s=s.replace('seconds == _state.durationSeconds)\n      return;', 'seconds == _state.durationSeconds) {\n      return;\n    }');p.write_text(s)
          p=Path('scripts/review/performance_regression.dart');s=p.read_text()
          if not s.startswith('// ignore_for_file:'):
              s='// Standalone CLI regression: relative imports permit execution without Flutter.\n// ignore_for_file: avoid_relative_lib_imports, avoid_print\n'+s
          s=s.replace('if (mode == PerformanceMode.vinyl)\n          check(a.events.any((e) => e.reverse), \'scratch reversal\');', 'if (mode == PerformanceMode.vinyl) {\n          check(a.events.any((e) => e.reverse), \'scratch reversal\');\n        }')
          s=s.replace('if (seconds == 30)\n          check(', 'if (seconds == 30) {\n          check(').replace("'30s second section',\n          );\n        checks++;", "'30s second section',\n          );\n        }\n        checks++;")
          p.write_text(s)
          PY
          git add lib/domain/performance_arranger.dart lib/features/create/creation_controller.dart scripts/review/performance_regression.dart
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: explicit control flow in performance modes and portable regression runner [skip ci]'
            git push origin HEAD:refs/heads/codex/mad-performance-modes
          fi
          gh run rerun 36074501764 --repo yurashu2-droid/OtoGrashi
