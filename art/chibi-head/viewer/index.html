<title>ちび頭ビューア</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* 一画面のおもちゃ：上にモデル、下に表情と背景のチップ列 */
:root {
  --bg: #F3EDE6; --stage: #E9E0D6; --fg: #3A2A2A; --muted: #7A6A62;
  --chip: #FFFFFF; --chip-on: #E8604C; --chip-on-fg: #FFFFFF; --ring: #2FA39A;
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1F1D20; --stage: #2B2B2E; --fg: #F3EDE6; --muted: #A99C94;
  --chip: #343238; --chip-on: #E8604C; --chip-on-fg: #FFFFFF; --ring: #4FC3B8; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1F1D20; --stage: #2B2B2E; --fg: #F3EDE6; --muted: #A99C94;
  --chip: #343238; --chip-on: #E8604C; --chip-on-fg: #FFFFFF; --ring: #4FC3B8; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); display: flex; flex-direction: column; }
#stage { flex: 1; min-height: 0; position: relative; background: var(--stage); }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; }
#panel { display: flex; flex-direction: column; gap: 12px; padding-block: 14px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.label { font-size: 11px; letter-spacing: .08em; color: var(--muted); width: 3.5em; }
button { font: inherit; font-weight: 800; font-size: 14px; border: 0; border-radius: 999px; padding: 8px 14px;
  background: var(--chip); color: var(--fg); cursor: pointer; }
button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }
button:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
.swatch { width: 32px; height: 32px; padding: 0; border: 2px solid transparent; }
.swatch[aria-pressed="true"] { border-color: var(--ring); }
#err { color: var(--chip-on); font-size: 13px; }
</style>

<div id="stage"><div id="hint">ドラッグで回す・ピンチで拡大</div></div>
<div id="panel">
  <div class="row" id="faces"><span class="label">表情</span></div>
  <div class="row" id="bgs"><span class="label">背景</span>
    <button id="spin" aria-pressed="true">くるくる</button></div>
  <div id="err" hidden></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const FACES = [["smile", "にっこり"], ["tongue", "ぺろっ"], ["wink", "ウインク"], ["surprised", "びっくり"], ["sleepy", "ねむい"]];
const BGS = ["#2B2B2E", "#E9E0D6", "#BFE3F2", "#F6C453"];

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(22, 1, 0.1, 100);
camera.position.set(1.6, 1.4, 9.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.15, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.autoRotate = true; controls.autoRotateSpeed = 1.6;

// 縦長の画面でも頭全体（髪の跳ねを含めて幅約4・帽子込みの高さ約4.6）が収まる距離にする
function fitDistance(aspect) {
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max(2.6 / t, 2.2 / (t * aspect));
}
function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const d = fitDistance(camera.aspect);
  controls.minDistance = d * 0.55;
  controls.maxDistance = d * 1.6;
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, d);
}
new ResizeObserver(resize).observe(stage);
resize();

const texLoader = new THREE.TextureLoader();
const faceTex = {};
let faceMat = null;
function loadFace(name) {
  if (!faceTex[name]) {
    faceTex[name] = texLoader.loadAsync(`face_${name}.png`).then(t => {
      t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
    });
  }
  return faceTex[name];
}
async function setFace(name) {
  for (const b of document.querySelectorAll("#faces button")) b.setAttribute("aria-pressed", b.dataset.face === name);
  if (!faceMat) return;
  faceMat.map = await loadFace(name);
  faceMat.needsUpdate = true;
}

function setBg(color) {
  stage.style.background = color;
  for (const b of document.querySelectorAll(".swatch")) b.setAttribute("aria-pressed", b.dataset.bg === color);
}

const facesRow = document.getElementById("faces");
for (const [key, label] of FACES) {
  const b = document.createElement("button");
  b.textContent = label; b.dataset.face = key; b.setAttribute("aria-pressed", "false");
  b.onclick = () => setFace(key);
  facesRow.append(b);
}
const bgRow = document.getElementById("bgs");
const spin = document.getElementById("spin");
for (const c of BGS) {
  const b = document.createElement("button");
  b.className = "swatch"; b.dataset.bg = c; b.style.background = c;
  b.setAttribute("aria-label", `背景 ${c}`); b.setAttribute("aria-pressed", "false");
  b.onclick = () => setBg(c);
  bgRow.insertBefore(b, spin);
}
spin.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  spin.setAttribute("aria-pressed", controls.autoRotate);
};
if (matchMedia("(prefers-reduced-motion: reduce)").matches) spin.click();
setBg(BGS[0]);

new GLTFLoader().load("chibi_head.gltf.json", gltf => {
  scene.add(gltf.scene);
  gltf.scene.traverse(o => {
    if (o.isMesh && o.material.name === "Face") faceMat = o.material;
  });
  setFace("smile");
}, undefined, e => {
  const err = document.getElementById("err");
  err.textContent = "モデルを読み込めませんでした。ページを再読み込みしてください。";
  err.hidden = false;
  console.error(e);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
